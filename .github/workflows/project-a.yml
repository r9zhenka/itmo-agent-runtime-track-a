name: Project A runtime
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test-ci

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare tools and images (network allowed here)
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 openssh-server
          sudo install -d -m 0755 /run/sshd
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          python3 -m scripts.install_rclone
          make init
          docker compose build
      - name: Run all offline acceptance checks in an isolated replay stack
        run: make check-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-a-results
          path: results/
