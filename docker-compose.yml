name: project-a-cp1

x-service: &service
  image: project-a-service:cp1
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=32m]
  networks: [internal]
  stop_grace_period: 35s
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
    interval: 5s
    timeout: 4s
    retries: 10
    start_period: 10s

services:
  sandbox-image:
    image: project-a-sandbox:cp1
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  sandbox-manager:
    <<: *service
    command: [python, -m, runtime.sandbox_manager]
    user: "0:0"
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run make init}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:?Run make init}
      SANDBOX_UID: ${SANDBOX_UID:-1000}
      SANDBOX_GID: ${SANDBOX_GID:-1000}
      INSTANCE_ID: ${INSTANCE_ID:-checkpoint1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_ROOT:?Run make init}:/workspaces:ro
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  llm-proxy:
    <<: *service
    command: [python, -m, runtime.llm_proxy]
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run make init}
      LLM_MODE: ${LLM_MODE:-replay}
      LLM_PROVIDER_URL: ${LLM_PROVIDER_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EXTRA_JSON: ${LLM_EXTRA_JSON:-}
    networks: [internal, model-egress]

  harness:
    <<: *service
    command: [python, -m, runtime.harness]
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run make init}
      MAX_STEPS: ${MAX_STEPS:-16}
    volumes: [traces:/traces]
    depends_on:
      sandbox-manager:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy

  gateway:
    <<: *service
    command: [python, -m, runtime.gateway]
    environment:
      CLIENT_TOKEN: ${CLIENT_TOKEN:?Run make init}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run make init}
    networks: [internal, frontend]
    ports: ["${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-18080}:8000"]
    depends_on:
      harness:
        condition: service_healthy

networks:
  frontend: {}
  internal:
    internal: true
  model-egress: {}

volumes:
  traces: {}
